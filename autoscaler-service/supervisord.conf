[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-server]
command=php artisan serve --host=0.0.0.0 --port=8003
directory=/var/www/html
autostart=true
autorestart=true
startsecs=3
startretries=3
stderr_logfile=/var/log/php-server.err.log
stdout_logfile=/var/log/php-server.out.log
stderr_logfile_maxbytes=10MB
stdout_logfile_maxbytes=10MB

[program:autoscaler-monitor]
command=php artisan autoscaler:monitor
directory=/var/www/html
autostart=true
autorestart=true
startsecs=10
startretries=0
numprocs=1
stderr_logfile=/var/log/autoscaler-monitor.err.log
stdout_logfile=/var/log/autoscaler-monitor.out.log
stderr_logfile_maxbytes=10MB
stdout_logfile_maxbytes=10MB

